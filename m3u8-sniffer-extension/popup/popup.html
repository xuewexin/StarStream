<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=450, initial-scale=1.0">
  <title>StarStream Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="#3875f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span class="brand-title">星流媒体嗅探器</span>
      </div>
      <div class="header-status">
        <div id="clientStatusBadge" class="status-pill offline" title="本地下载器连接状态">
          <span class="status-dot"></span>
          <span id="clientStatusText">客户端离线</span>
        </div>
      </div>
      <div class="header-tools">
        <button id="btnSettings" class="btn-icon" title="设置">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btnClear" class="btn-icon" title="清空记录">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 分类 Tabs -->
    <nav class="category-tabs">
      <button class="tab-item active" data-cat="all">全部 <span id="countAll" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="m3u8">流媒体 <span id="countM3u8" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="video">视频 <span id="countVideo" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="audio">音频 <span id="countAudio" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="other">其他 <span id="countOther" class="tab-badge">0</span></button>
    </nav>

    <!-- 搜索与控制条 -->
    <div class="search-bar">
      <label class="select-all-label">
        <input type="checkbox" id="selectAllCheckbox"> 全选
      </label>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="搜索媒体名称、域名或链接..." class="search-input">
      </div>
    </div>

    <!-- 批量操作悬浮条 -->
    <div id="batchBar" class="batch-bar hidden">
      <span id="batchCountText">已选 0 项</span>
      <div class="batch-actions">
        <button id="btnBatchPush" class="btn-sm btn-primary">批量推送到客户端</button>
        <button id="btnBatchCopy" class="btn-sm btn-secondary">复制链接</button>
        <button id="btnBatchDelete" class="btn-sm btn-danger">删除</button>
      </div>
    </div>

    <!-- 嗅探资源主列表 -->
    <main id="mediaListContainer" class="media-list">
      <div id="emptyPlaceholder" class="empty-placeholder">
        <svg class="empty-svg" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.93 4.93a10 10 0 0 1 14.14 0"></path>
          <path d="M7.76 7.76a6 6 0 0 1 8.48 0"></path>
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M12 14v7"></path>
        </svg>
        <div class="empty-title">正在监听网页媒体流</div>
        <div class="empty-desc">播放视频或音频后，嗅探到的地址将自动列在此处</div>
      </div>
    </main>

    <!-- 媒体播放预览模态弹窗 -->
    <div id="previewModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span id="previewTitle" class="modal-title">媒体预览</span>
          <button id="closePreviewBtn" class="btn-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <video id="previewVideo" controls autoplay></video>
          <audio id="previewAudio" controls autoplay class="hidden"></audio>
        </div>
      </div>
    </div>

    <!-- 设置抽屉面板 -->
    <div id="settingsPanel" class="settings-drawer hidden">
      <div class="drawer-header">
        <span>连接与规则设置</span>
        <button id="closeSettingsBtn" class="btn-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-body">
        <div class="setting-item">
          <label>本地客户端通信端口:</label>
          <input type="number" id="settingPort" value="18910" class="input-text">
        </div>
        <div class="setting-item">
          <label class="checkbox-row">
            <input type="checkbox" id="settingAutoPush"> 嗅探到媒体时自动推送到本地客户端下载
          </label>
        </div>
        <div class="setting-item">
          <label>过滤小文件 (KB，0 表示不过滤):</label>
          <input type="number" id="settingMinSize" value="0" class="input-text">
        </div>
        <div class="client-help-box">
          <div class="help-title">客户端状态说明</div>
          <p>若显示“客户端离线”，请双击根目录下 <strong>启动灵猫下载器.bat</strong> 打开桌面客户端。</p>
        </div>
      </div>
      <div class="drawer-footer">
        <button id="saveSettingsBtn" class="btn-primary btn-block">保存设置</button>
      </div>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
