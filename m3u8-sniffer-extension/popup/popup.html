<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=450, initial-scale=1.0">
  <title>StarStream Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="#3875f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span class="brand-title">星流媒体嗅探器</span>
      </div>
      <div class="header-status">
        <div id="clientStatusBadge" class="status-pill offline" title="本地下载器连接状态">
          <span class="status-dot"></span>
          <span id="clientStatusText">客户端离线</span>
        </div>
      </div>
      <div class="header-tools">
        <button id="btnFragments" class="btn-icon" title="分片文件夹管理 (整理与清空切片)">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button id="btnSettings" class="btn-icon" title="设置">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btnClear" class="btn-icon" title="清空记录">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 页面生命周期范围 (只显示当前还存在的网站视频，页面消失自动刷新清理) -->
    <div class="scope-tabs-bar">
      <button id="scopeCurrentTab" class="scope-btn active" title="仅显示当前正浏览网页上抓取的视频">当前网页视频</button>
      <button id="scopeAllTabs" class="scope-btn" title="显示所有仍存活打开的网页视频 (网页关闭或刷新后立即自动消除)">全部存活网页</button>
    </div>

    <!-- 分类 Tabs -->
    <nav class="category-tabs">
      <button class="tab-item active" data-cat="all">全部 <span id="countAll" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="m3u8">流媒体 <span id="countM3u8" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="video">视频 <span id="countVideo" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="audio">音频 <span id="countAudio" class="tab-badge">0</span></button>
      <button class="tab-item" data-cat="other">其他 <span id="countOther" class="tab-badge">0</span></button>
    </nav>

    <!-- 搜索与控制条 -->
    <div class="search-bar">
      <label class="select-all-label">
        <input type="checkbox" id="selectAllCheckbox"> 全选
      </label>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="搜索媒体名称、域名或链接..." class="search-input">
      </div>
    </div>

    <!-- 批量操作悬浮条 -->
    <div id="batchBar" class="batch-bar hidden">
      <span id="batchCountText">已选 0 项</span>
      <div class="batch-actions">
        <button id="btnBatchPush" class="btn-sm btn-primary">批量推送到客户端</button>
        <button id="btnBatchCopy" class="btn-sm btn-secondary">复制链接</button>
        <button id="btnBatchDelete" class="btn-sm btn-danger">删除</button>
      </div>
    </div>

    <!-- 嗅探资源主列表 -->
    <main id="mediaListContainer" class="media-list">
      <div id="emptyPlaceholder" class="empty-placeholder">
        <svg class="empty-svg" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.93 4.93a10 10 0 0 1 14.14 0"></path>
          <path d="M7.76 7.76a6 6 0 0 1 8.48 0"></path>
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M12 14v7"></path>
        </svg>
        <div class="empty-title">当前页面暂未嗅探到完整视频</div>
        <div class="empty-desc">已过滤无用碎片切片；在网页播放视频后，完整 M3U8/MP4 将自动显示</div>
      </div>
    </main>

    <!-- 媒体播放预览模态弹窗 -->
    <div id="previewModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span id="previewTitle" class="modal-title">媒体预览</span>
          <button id="closePreviewBtn" class="btn-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <video id="previewVideo" controls autoplay></video>
          <audio id="previewAudio" controls autoplay class="hidden"></audio>
        </div>
      </div>
    </div>

    <!-- 分片管理快捷弹窗 -->
    <div id="fragmentsModal" class="modal-overlay hidden">
      <div class="modal-content" style="max-height: 480px;">
        <div class="modal-header">
          <span class="modal-title">📁 本地分片文件夹管理</span>
          <button id="closeFragmentsBtn" class="btn-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body" style="padding: 14px;">
          <div style="color: #9ca3af; font-size: 12px; margin-bottom: 8px;">专用分片目录: <span id="fragDirPath" style="color: #38bdf8; font-family: monospace;">Temp_Segments</span></div>
          <div id="fragStats" style="font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #f4f4f5;">正在获取本地分片状态...</div>
          <div id="fragListContainer" style="max-height: 220px; overflow-y: auto; background: #18191d; border-radius: 6px; padding: 8px; border: 1px solid #2e3138; margin-bottom: 12px;"></div>
          <div style="display: flex; gap: 8px;">
            <button id="btnCleanAllFrags" class="btn-sm btn-danger" style="flex: 1;">一键清空全部残留分片</button>
            <button id="btnRefreshFrags" class="btn-sm btn-secondary">刷新</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 设置抽屉面板 -->
    <div id="settingsPanel" class="settings-drawer hidden">
      <div class="drawer-header">
        <span>嗅探与连接设置</span>
        <button id="closeSettingsBtn" class="btn-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-body">
        <div class="setting-item">
          <label>本地客户端通信端口:</label>
          <input type="number" id="settingPort" value="18910" class="input-text">
        </div>
        <div class="setting-item">
          <label class="checkbox-row">
            <input type="checkbox" id="settingFilterFragments" checked> <strong>仅抓取整个视频</strong> (过滤海量无用切片与未知碎片)
          </label>
        </div>
        <div class="setting-item">
          <label class="checkbox-row">
            <input type="checkbox" id="settingAutoPurge" checked> <strong>页面关闭或刷新时自动消除</strong> 对应网页抓取的视频
          </label>
        </div>
        <div class="setting-item">
          <label class="checkbox-row">
            <input type="checkbox" id="settingAutoPush"> 嗅探到媒体时自动推送到本地客户端下载
          </label>
        </div>
        <div class="setting-item">
          <label>过滤小文件 (KB，0 表示不过滤):</label>
          <input type="number" id="settingMinSize" value="0" class="input-text">
        </div>
        <div class="client-help-box">
          <div class="help-title">分片切片存放管理</div>
          <p>所有下载中临时分片集中存放在软件根目录 <strong>Temp_Segments</strong> 文件夹下，下载成功后自动合并，可随时在右上角文件夹图标中整理和删除。</p>
        </div>
      </div>
      <div class="drawer-footer">
        <button id="saveSettingsBtn" class="btn-primary btn-block">保存设置</button>
      </div>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
